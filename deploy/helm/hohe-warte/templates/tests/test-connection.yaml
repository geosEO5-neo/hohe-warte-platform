apiVersion: v1
kind: Pod
metadata:
  name: {{ include "hw.fullname" . }}-test
  # Bewusst OHNE die Selector-Labels der App: sonst würde der Test-Pod selbst von
  # Service, PDB und der Egress-NetworkPolicy der App erfasst.
  labels:
    app.kubernetes.io/name: {{ include "hw.name" . }}-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
      command: ["sh", "-c"]
      args:
        - >-
          curl -fsS http://{{ include "hw.fullname" . }}:{{ .Values.service.port }}/readyz &&
          curl -fsS http://{{ include "hw.fullname" . }}:{{ .Values.service.port }}/metrics/ | grep -q geosphere_observation
