{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hw.fullname" . }}-dashboard
  labels:
    {{- include "hw.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}{{ toYaml . | nindent 4 }}{{ end }}
data:
  hohe-warte.json: |-
{{ .Files.Get "dashboards/hohe-warte.json" | indent 4 }}
{{- end }}
