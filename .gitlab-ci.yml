# GitLab-CI-Pendant zur GitHub-Actions-Pipeline (.github/workflows/ci.yml).
# Zeigt dasselbe Stage-Modell für eine selbst betriebene GitLab-Instanz:
# test -> validate -> build -> scan -> deploy (Helm in einen bestehenden Cluster).
stages: [test, validate, build, scan, deploy]

variables:
  IMAGE: $CI_REGISTRY_IMAGE/hohe-warte
  DOCKER_TLS_CERTDIR: "/certs"

unit-tests:
  stage: test
  image: python:3.13-slim
  script:
    - cd app && pip install -e ".[dev]"
    - ruff check . && pytest -v --junitxml=report.xml
  artifacts:
    reports: { junit: app/report.xml }

helm-validate:
  stage: validate
  image: alpine/helm:3.16.3
  script:
    - helm lint deploy/helm/hohe-warte --strict
    - helm template ci deploy/helm/hohe-warte > rendered.yaml
  artifacts: { paths: [rendered.yaml] }

terraform-validate:
  stage: validate
  image: { name: hashicorp/terraform:1.9.8, entrypoint: [""] }
  script:
    - cd infra/terraform
    - terraform fmt -check -recursive
    - terraform init -backend=false && terraform validate

build-image:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --build-arg VERSION=$CI_COMMIT_REF_NAME --build-arg REVISION=$CI_COMMIT_SHA -t $IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $IMAGE:$CI_COMMIT_SHORT_SHA

trivy-scan:
  stage: scan
  image: { name: aquasec/trivy:0.57.1, entrypoint: [""] }
  variables: { TRIVY_USERNAME: $CI_REGISTRY_USER, TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD }
  script:
    - trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 $IMAGE:$CI_COMMIT_SHORT_SHA

deploy-staging:
  stage: deploy
  image: alpine/helm:3.16.3
  environment: { name: staging }
  rules: [{ if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH }]
  script:
    # KUBECONFIG kommt als File-Variable aus den CI/CD-Settings bzw. über den GitLab Agent
    - helm upgrade --install hohe-warte deploy/helm/hohe-warte
        --namespace hohe-warte --create-namespace --atomic --timeout 5m
        --set image.repository=$IMAGE --set image.tag=$CI_COMMIT_SHORT_SHA
