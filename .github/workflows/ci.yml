name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hohe-warte

jobs:
  test:
    name: Lint & Unit-Tests (Python)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: app/pyproject.toml }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check . || true   # informativ
      - run: pytest -v

  static:
    name: Dockerfile, Helm & Terraform prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, ignore: DL3008 }
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/hohe-warte --strict
      - name: kubeconform (inkl. CRDs)
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          helm template ci deploy/helm/hohe-warte --api-versions monitoring.coreos.com/v1 \
            --set autoscaling.enabled=true --set ingress.enabled=true \
          | ./kubeconform -strict -summary -kubernetes-version 1.36.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8" }
      - name: terraform fmt/validate
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  image:
    name: Image bauen & scannen
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hohe-warte:ci
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container-Smoke-Test
        run: |
          docker run -d --name hw -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL hohe-warte:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/readyz && break; sleep 2; done
          curl -fsS localhost:8080/metrics/ | grep geosphere_observation
          docker inspect --format '{{.Config.User}}' hohe-warte:ci | grep -q 10001
      - name: Trivy-Schwachstellenscan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: hohe-warte:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  e2e:
    name: E2E – Terraform → kind → Monitoring → Helm
    runs-on: ubuntu-latest
    needs: [test, static]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., load: true, tags: "hohe-warte:e2e", cache-from: type=gha }
      - uses: helm/kind-action@v1
        with: { install_only: true }
      - uses: azure/setup-helm@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.9.8", terraform_wrapper: false }
      - name: terraform apply
        working-directory: infra/terraform
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false -var app_image=hohe-warte:e2e -var worker_count=1
          echo "KUBECONFIG=$(terraform output -raw kubeconfig_path)" >> "$GITHUB_ENV"
      - name: Rollout & helm test
        run: |
          kubectl get nodes -o wide
          kubectl -n hohe-warte rollout status deploy/hohe-warte --timeout=180s
          kubectl -n hohe-warte get pods,svc,pdb,networkpolicy,servicemonitor,prometheusrule
          helm -n hohe-warte test hohe-warte --logs
      - name: Prometheus scrapt die App & Alert-Regeln sind geladen
        run: |
          kubectl -n monitoring port-forward svc/kube-prometheus-stack-prometheus 9090:9090 &
          sleep 5
          for i in $(seq 1 30); do
            r=$(curl -s 'localhost:9090/api/v1/query' --data-urlencode 'query=count(geosphere_observation)' | jq -r '.data.result[0].value[1] // "0"')
            echo "geosphere_observation series: $r"; [ "$r" != "0" ] && break; sleep 10
          done
          [ "$r" != "0" ]
          curl -s localhost:9090/api/v1/rules | jq -e '[.data.groups[] | select(.name=="hohe-warte.rules")] | length == 1'
          curl -s localhost:9090/api/v1/targets | jq -r '.data.activeTargets[] | select(.labels.namespace=="hohe-warte") | "\(.labels.job) \(.health)"'
      - name: Diagnose bei Fehlern
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n hohe-warte describe pods
          kubectl -n hohe-warte logs -l app.kubernetes.io/name=hohe-warte --tail=100
      - name: terraform destroy
        if: always()
        working-directory: infra/terraform
        run: terraform destroy -auto-approve -input=false -var app_image=hohe-warte:e2e -var worker_count=1 || true

  release:
    name: Release (Image + Helm-Chart nach GHCR)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [image, e2e]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - uses: azure/setup-helm@v4
      - name: Helm-Chart als OCI-Artefakt veröffentlichen
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/hohe-warte --version "${GITHUB_REF_NAME#v}" --app-version "${GITHUB_REF_NAME#v}"
          helm push hohe-warte-*.tgz "oci://ghcr.io/${{ github.repository_owner }}/charts"
